name: ML CI

on:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/ci-ml.yml'
  pull_request:
    paths:
      - 'ml/**'

jobs:
  test:
    name: Run ML tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/ml/training/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/training/requirements.txt

      - name: Run pytest
        run: |
          mkdir -p ml/training/reports
          pytest -q ml/training/tests --maxfail=1 | tee ml/training/reports/pytest.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-pytest-log
          path: ml/training/reports/pytest.log
