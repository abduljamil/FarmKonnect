server {
    listen 80;
    server_name farmkonnect.app www.farmkonnect.app;

    # Certbot Challenge (Must be accessible on HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name farmkonnect.app www.farmkonnect.app;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/farmkonnect.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmkonnect.app/privkey.pem;

    # Recommended SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ---- Docker DNS re-resolution ----------------------------------------
    # nginx caches upstream IPs at start-up and never re-resolves unless told
    # to. That's fine for `docker-compose down && up -d --build` (everything
    # recreates together so nginx's first lookup is current). But for ANY
    # partial restart of `backend` alone (`docker compose up -d --no-deps
    # --force-recreate backend`, or a `restart: always` flap), the backend
    # container gets a new IP on the shared docker network, nginx keeps
    # proxying to the dead old IP, and every /api/ + /socket.io/ request
    # returns 502 until nginx itself is restarted.
    #
    # Fix: point nginx at Docker's embedded DNS (127.0.0.11) and use a
    # VARIABLE in proxy_pass — that's what flips nginx from "resolve once at
    # boot" to "re-resolve on demand". `valid=10s` keeps the cache tight so
    # an IP change is picked up within ~10 seconds.
    # ----------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API Proxy
    location /api/ {
        set $backend_upstream "backend:3000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase body size for large image uploads
        client_max_body_size 20M;

        # Increase timeouts for slow uploads to Cloudinary
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Socket.io Proxy
    location /socket.io/ {
        set $backend_ws_upstream "backend:3000";
        proxy_pass http://$backend_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
 
