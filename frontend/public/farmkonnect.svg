<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wheat grain - golden/amber colors like 🌾 emoji - larger size -->
  <g>
    <!-- Main stem - green -->
    <rect x="29" y="42" width="6" height="22" rx="3" fill="#7cb342"/>
    <!-- Wheat grains - golden amber -->
    <!-- Left side grains -->
    <ellipse cx="22" cy="34" rx="9" ry="14" transform="rotate(-20 22 34)" fill="#f9a825"/>
    <ellipse cx="18" cy="18" rx="7" ry="11" transform="rotate(-25 18 18)" fill="#f9a825"/>
    <ellipse cx="16" cy="5" rx="5" ry="8" transform="rotate(-30 16 5)" fill="#fbc02d"/>
    <!-- Right side grains -->
    <ellipse cx="42" cy="34" rx="9" ry="14" transform="rotate(20 42 34)" fill="#f9a825"/>
    <ellipse cx="46" cy="18" rx="7" ry="11" transform="rotate(25 46 18)" fill="#f9a825"/>
    <ellipse cx="48" cy="5" rx="5" ry="8" transform="rotate(30 48 5)" fill="#fbc02d"/>
    <!-- Center top grain -->
    <ellipse cx="32" cy="8" rx="7" ry="14" fill="#fbc02d"/>
    <!-- Grain details/highlights -->
    <ellipse cx="22" cy="32" rx="3" ry="6" transform="rotate(-20 22 32)" fill="#fdd835" opacity="0.6"/>
    <ellipse cx="42" cy="32" rx="3" ry="6" transform="rotate(20 42 32)" fill="#fdd835" opacity="0.6"/>
    <ellipse cx="32" cy="6" rx="3" ry="6" fill="#ffeb3b" opacity="0.5"/>
  </g>
</svg>
