name: Build and Push ML Image

on:
  push:
    paths:
      - 'ml/**'
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./ml/training
          file: ./ml/training/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:ml-latest
            ghcr.io/${{ github.repository }}:ml-${{ github.run_id }}

      - name: Image info
        run: echo "Published ML image to ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}"
