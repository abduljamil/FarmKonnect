apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-retrain-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-retrain-worker
  template:
    metadata:
      labels:
        app: ml-retrain-worker
    spec:
      restartPolicy: Always
      containers:
        - name: retrain-worker
          image: ghcr.io/abduljamil/FarmKonnect:ml-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: ml-secrets
                  key: mongodb_uri
            - name: WORKER_POLL_INTERVAL
              value: "30"
          command: ["python", "-u", "retrain_worker.py"]
          workingDir: /app
      # serviceAccountName: ml-worker-sa
