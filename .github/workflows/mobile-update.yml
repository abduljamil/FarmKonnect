name: Mobile CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: OTA Update (runs on EVERY mobile push)
  # Pushes a new JS bundle so users' apps update
  # silently without reinstalling the APK.
  # ──────────────────────────────────────────────
  ota-update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Publish OTA update
        working-directory: ./mobile
        run: eas update --branch preview --message "Auto-update from ${{ github.sha }}" --non-interactive

  # ──────────────────────────────────────────────
  # Job 2: Build APK + Deploy to EC2
  # Only runs when commit message contains [build-apk]
  # Builds a new APK, downloads it, and uploads
  # it to EC2 so farmkonnect.app/app serves it.
  # ──────────────────────────────────────────────
  build-and-deploy-apk:
    name: Build APK & Deploy to EC2
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[build-apk]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build Android APK
        working-directory: ./mobile
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK from EAS
        working-directory: ./mobile
        run: |
          # Get the download URL of the latest APK build
          APK_URL=$(eas build:list --platform android --status finished --limit 1 --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          echo "Downloading APK from: $APK_URL"
          curl -L -o farmkonnect.apk "$APK_URL"
          ls -la farmkonnect.apk

      - name: Upload APK to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mobile/farmkonnect.apk"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy APK on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Copy APK into the frontend's public directory inside the Docker container
            echo "📦 Deploying new APK..."
            docker cp /tmp/farmkonnect.apk farmkonnect-frontend-1:/usr/share/nginx/html/farmkonnect.apk
            rm -f /tmp/farmkonnect.apk

            echo "✅ APK deployed! Available at https://farmkonnect.app/farmkonnect.apk"
