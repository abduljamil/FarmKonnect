name: Build and Push ML Image

on:
  push:
    paths:
      - 'ml/**'
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./ml/training
          file: ./ml/training/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}:ml-latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}:ml-${{ github.run_id }}

      - name: Image info
        run: echo "Published ML image to ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}"
