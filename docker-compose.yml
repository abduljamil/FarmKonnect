# Rotate container logs. Without this Docker's json-file logs grow forever —
# the backend's log hit 4.8 GB during the 2026-09-30 Mongo reconnect storm and
# filled the 15 GB root disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    restart: always
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SCRAPER_SERVICE_URL=${SCRAPER_SERVICE_URL:-http://scraper_service:8000}
    depends_on:
      - scraper_service
    env_file:
      - ./backend/.env
    restart: always
    logging: *default-logging

  scraper_service:
    build:
      context: ./scrapper
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Optional: Expose 8000 if you want to test loopback from host, but backend uses internal DNS
    environment:
      - PORT=8000
    env_file:
        - ./backend/.env  # Use backend .env because scrapper needs valid MONGO_URI
        - ./scrapper/.env
    restart: always
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    logging: *default-logging

  prediction_service:
    # Phase 8 — weekly forecaster. Long-running container, ticks hourly, runs
    # one prediction cycle per week (Saturday onwards for the prior W-FRI panel).
    # First run backfills 12 weeks so the chart has historical context.
    build:
      context: .
      dockerfile: prediction_service/Dockerfile
    env_file:
      - ./backend/.env       # provides MONGODB_URI (same as backend / scraper)
    environment:
      - PREDICTION_COLLECTION=pricepredictions
      - MONGODB_DB=FarmKonnect
      - RUN_INTERVAL_SECONDS=3600
      - EARLIEST_RUN_DAY_OFFSET=1   # wait until Saturday UTC before predicting for Fri
      - BACKFILL_WEEKS=12
    restart: always
    logging: *default-logging

networks:
  default:
    driver: bridge
