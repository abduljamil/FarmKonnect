apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-predict-cronjob
  namespace: default
spec:
  schedule: "0 2 * * *" # daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ml-predict
              image: ghcr.io/abduljamil/FarmKonnect:ml-latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: ml-secrets
                      key: mongodb_uri
                - name: TZ
                  value: "UTC"
              command: ["python", "-u", "predict_and_push.py"]
              workingDir: /app
          # serviceAccountName: ml-runner # uncomment if using RBAC
