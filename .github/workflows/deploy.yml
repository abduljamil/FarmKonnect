name: Deploy to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "**/*.md"

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: ./frontend
        run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # --legacy-peer-deps matches backend/Dockerfile: multer-storage-cloudinary@4
      # declares a peer of cloudinary@^1 while the project runs cloudinary@^2.
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --legacy-peer-deps

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

  deploy:
    needs: [lint-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Phase 11 (2026-06-03): set -e + set -o pipefail so any failed step
            # in this remote script aborts the deploy with a non-zero exit code.
            # Previously the absence of these flags meant `docker-compose up -d
            # --build` failures (image build errors, OOM during pip install,
            # etc.) were treated as success — the script silently fell through
            # to `docker image prune -f` and SSH returned 0. That left the box
            # in a fully-stopped state after `docker-compose down` while GH
            # Actions reported a green ✅. We hit this multiple times during
            # Phase 8.
            set -euo pipefail

            # Prefer Docker Compose v2 (`docker compose`). The legacy v1
            # (`docker-compose`, Python) crashes with `KeyError: 'ContainerConfig'`
            # when recreating containers against Docker Engine 25+/26+, which
            # dropped that deprecated image-metadata field. Fall back to v1 only
            # if the v2 plugin is unavailable.
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD=(docker compose)
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD=(docker-compose)
            else
              echo "❌ Docker Compose is not installed on the EC2 instance."
              exit 1
            fi

            cd ~/FarmKonnect
            echo "🔵 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🟡 Rebuilding and restarting containers..."
            "${COMPOSE_CMD[@]}" up -d --build

            echo "🟢 Deployment complete!"
            docker image prune -f
