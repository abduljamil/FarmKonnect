version: '3.8'

services:
  ml_predict:
    build:
      context: ./ml/training
    image: ${ML_IMAGE:-farmkonnect/ml:latest}
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - ./ml/training/data:/app/data:ro
      - ./ml/training/ensemble_models:/app/ensemble_models:ro
    command: ["python", "predict_and_push.py", "--features", "/app/data/features.parquet", "--ensemble", "/app/ensemble_models", "--horizon", "4"]

  retrain_worker:
    build:
      context: ./ml/training
    image: ${ML_IMAGE:-farmkonnect/ml:latest}
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - ./ml/training/data:/app/data:rw
    command: ["python", "retrain_worker.py"]
